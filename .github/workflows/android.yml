name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Optional: real AdMob ids (repository secrets). Empty values fall back to Google's test ids.
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
      # Optional: release signing. Without these the release build is signed with the debug key.
      ZEN_KEYSTORE_BASE64: ${{ secrets.ZEN_KEYSTORE_BASE64 }}
      ZEN_KEYSTORE_PASSWORD: ${{ secrets.ZEN_KEYSTORE_PASSWORD }}
      ZEN_KEY_ALIAS: ${{ secrets.ZEN_KEY_ALIAS }}
      ZEN_KEY_PASSWORD: ${{ secrets.ZEN_KEY_PASSWORD }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: env.ZEN_KEYSTORE_BASE64 != ''
        run: |
          echo "$ZEN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zen-release.jks"
          echo "ZEN_KEYSTORE_FILE=$RUNNER_TEMP/zen-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK + AAB and run lint
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease lint --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zen-mower-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zen-mower-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.*
          if-no-files-found: ignore

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/zen-release.jks"
