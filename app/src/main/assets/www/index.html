<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E2A1B">
<title>Zen Mower</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="topbar">
    <button id="btnSettings" class="round-btn" aria-label="Settings"></button>
    <button id="levelBox" aria-label="Next lawn">
      <div id="levelTitle"><span id="levelNum">Level 1</span><span id="biomeName">Spring Meadow</span></div>
      <div id="progress"><div id="progressFill"></div><div id="progressShine"></div><span id="progressText"></span></div>
    </button>
    <div id="wallet">
      <div id="cash" class="pill"><i class="ico-coin"></i><span id="cashText">0</span></div>
      <div id="gems" class="pill small"><i class="ico-gem"></i><span id="gemText">0</span></div>
    </div>
  </div>

  <div id="chips">
    <div id="comboChip" class="chip hidden"><span id="comboText">COMBO ×1.1</span><div class="chip-bar"><div id="comboBar"></div></div></div>
    <div id="frenzyChip" class="chip green hidden"><span id="frenzyText">FRENZY</span></div>
  </div>

  <div id="actions">
    <div class="act-left">
      <button id="btnZen" class="act-btn" aria-label="Zen mode"><span class="act-ico"></span><span class="act-lbl">Zen</span></button>
      <button id="btnShop" class="act-btn" aria-label="Mower shop"><span class="act-ico"></span><span class="act-lbl">Shop</span></button>
    </div>
    <button id="btnBoost" class="act-btn gold" aria-label="Double cash"><span class="act-ico"></span><span class="act-lbl" id="boostLbl">×2 Cash</span></button>
  </div>

  <button id="zenExit" aria-label="Exit zen view"></button>
  <div id="banner" class="hidden"><div id="bannerTitle"></div><div id="bannerSub"></div></div>
  <div id="toast" class="hidden"></div>
  <div id="tutorial" class="hidden"><div id="tutHand"></div><div id="tutText">Drag to mow</div></div>

  <div id="bottom">
    <div id="upgrades"></div>
  </div>
</div>

<div id="modal" class="hidden"><div id="modalCard"></div></div>

<div id="loading">
  <div class="load-logo"><div class="load-mower"></div><h1>Zen Mower</h1><p>relaxing ASMR grass cutting</p></div>
  <div class="load-bar"><div id="loadFill"></div></div>
</div>

<script src="js/util.js"></script>
<script src="js/i18n.js"></script>
<script src="js/biomes.js"></script>
<script src="js/economy.js"></script>
<script src="js/levelgen.js"></script>
<script src="js/field.js"></script>
<script src="js/gl.js"></script>
<script src="js/shaders.js"></script>
<script src="js/sprites.js"></script>
<script src="js/render.js"></script>
<script src="js/particles.js"></script>
<script src="js/game.js"></script>
<script src="js/audio.js"></script>
<script src="js/bridge.js"></script>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
