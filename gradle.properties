# Gradle / build settings
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# AdMob configuration (optional). Leave unset to build with Google's official TEST ids.
# Supply real ids via -PADMOB_APP_ID=..., environment variables of the same name,
# or a gitignored admob.properties file in the project root (see admob.properties.example).
#   ADMOB_APP_ID, ADMOB_BANNER_ID, ADMOB_INTERSTITIAL_ID, ADMOB_REWARDED_ID
#   ADMOB_TEST_DEVICE_IDS   comma-separated hashed device ids (AdMob + UMP test devices)
#   UMP_DEBUG_GEOGRAPHY     debug builds only: EEA | REGULATED_US_STATE | OTHER (default: off)
